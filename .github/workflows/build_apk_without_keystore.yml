name: Build & Ship APK (Telegram) arm64 only, no keystore

on:
  push:
    branches: [pro]
  workflow_dispatch:

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.4"
          channel: "stable"
          cache: true

      - name: Flutter Pub Get
        run: flutter pub get
  
      - name: Decode firebase_options.dart from Base64 secret
        env:
            FIREBASE_OPTIONS_B64: ${{ secrets.FIREBASE_OPTIONS_B64 }}
        run: |
            mkdir -p lib
            echo "$FIREBASE_OPTIONS_B64" | base64 -d > lib/firebase_options.dart
  
      - name: Decode google-services.json from Base64 secret
        env:
            GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
            echo "$GOOGLE_SERVICES_JSON_B64" | base64 -d > android/app/google-services.json
  
      - name: Build APK (release, arm64 only)
        run: flutter build apk --release --target-platform android-arm64 2>&1 | tee build.log
  

      # build only arm64-v8a APK and save log for error reporting
      - name: Build APK (release, arm64 only)
        run: flutter build apk --release --target-platform android-arm64 2>&1 | tee build.log

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-arm64
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7

      - name: Send APK to Telegram
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
            -F chat_id="${TELEGRAM_CHAT_ID}" \
            -F caption="✅ app-release.apk (arm64) • $GITHUB_REPOSITORY • ${GITHUB_REF#refs/*/}" \
            -F document=@build/app/outputs/flutter-apk/app-release.apk

      - name: Telegram Failure Notify (send error log)
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # take last 40 lines of log only to avoid message length limit
          tail -n 40 build.log > build_error.log || echo "No build.log found." > build_error.log

          # if error is short (less than 3500 characters), send it as text, otherwise send the log file
          if [ $(wc -c < build_error.log) -lt 3500 ]; then
            curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TELEGRAM_CHAT_ID}" \
              --data-urlencode text="❌ Android build failed for $GITHUB_REPOSITORY @ ${GITHUB_REF#refs/*/} (commit $GITHUB_SHA)\n\n$(cat build_error.log)"
          else
            curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
              -F chat_id="${TELEGRAM_CHAT_ID}" \
              -F caption="❌ Build failed for $GITHUB_REPOSITORY @ ${GITHUB_REF#refs/*/} (commit $GITHUB_SHA). See attached error log." \
              -F document=@build_error.log
          fi
