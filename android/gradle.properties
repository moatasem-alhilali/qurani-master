org.gradle.jvmargs=-Xmx6G -XX:MaxMetaspaceSize=2G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -XX:+UseG1GC
org.gradle.workers.max=2
android.useAndroidX=true
# Jetifier مطفأ عمدًا.
#
# كان يعيد كتابة كل jar في مسار الصنف — بما فيها jar محرّك فلاتر نفسه — بحثًا
# عن android.support.* القديمة، وهناك نفدت الذاكرة:
#   JetifyTransform ... x86_64_release-....jar > Java heap space
# ولا شيء في التطبيق يحتاجه: المراجع الثلاثة الوحيدة لـ android.support نصوص
# لا أصناف — audio_service يستوردها من androidx.media الذي يحتفظ بالاسم نفسه،
# و share_plus اسم meta-data في المانيفست، و flutter_inappwebview سلسلة intent.
# للتأكّد بنفسك: ./gradlew checkJetifier
android.enableJetifier=false
kotlin.incremental=false
